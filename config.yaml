# Scanner thresholds. Change these without touching Python code.
pullback_distance_to_ema_percent: 5.0
breakout_distance_to_50d_high_percent: 3.0
extended_distance_to_ema10_percent: 10.0
extended_distance_to_ema21_percent: 15.0
rsi_pullback_min: 45.0
rsi_pullback_max: 65.0
rsi_breakout_min: 60.0
rsi_extended: 75.0
relative_volume_breakout_min: 1.3
relative_volume_breakdown_min: 1.3
minimum_history_days: 80

# Pullback watch filters. Intended for after-hours review:
# daily trend/position finds candidates; intraday trigger is a review aid, not a live entry signal.
pullback_min_20d_return_percent: 8.0
pullback_min_60d_return_percent: 15.0
pullback_max_relative_volume: 1.25
pullback_support_buffer_percent: 3.0
pullback_high_lookback_days: 20
pullback_min_days_from_high: 2
pullback_max_days_from_high: 12
pullback_stop_lookback_days: 8
pullback_stop_buffer_percent: 0.5
pullback_max_risk_percent: 10.0

# Intraday review trigger. yfinance intraday data can lag; confirm on TradingView/broker chart.
# Default to 4h because yfinance supports it directly and it matches the slower JLaw-style review workflow.
# Change to 1h if you want a more sensitive but noisier trigger.
use_intraday_trigger: true
intraday_period: 60d
intraday_interval: 4h
intraday_min_bars: 20
intraday_trigger_lookback_bars: 5
intraday_strong_close_min: 0.60

# New ranking / risk filters
min_avg_dollar_volume_millions: 30.0
high_atr_percent: 6.0
very_high_atr_percent: 10.0
rs_lookback_days_short: 20
rs_lookback_days_long: 60

# Category weights turn technical_score into priority_score.
# Use this to down-rank technically strong stocks that are outside the current AI capex focus.
category_weights:
  core_watchlist: 1.20
  ai_compute_semis: 1.15
  foundry_manufacturing: 1.05
  memory_storage: 1.18
  semi_equipment_lithography: 1.10
  semi_materials_components: 1.18
  optical_networking_photonics: 1.12
  ai_cloud_infra: 0.95
  bitcoin_ai_power_infra: 1.12
  power_grid_electrical: 1.08
  data_center_reits_infra: 0.65
  cooling_hvac_construction: 0.90
  space_defense: 1.08
  nuclear_uranium_power: 1.02
  software_data_security: 0.60
  physical_ai_robotics: 1.12
  edge_ai_electronics: 1.10
  networking_connectivity: 1.02
  clean_energy_power: 0.95
  cloud_software_growth: 0.85
  crypto_fintech: 0.90
  tradingview_import_misc: 0.80
